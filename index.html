<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>回家巴士</title>

<style>
:root{
  --cream:#fff8ec;
  --cream-deep:#f7ead7;
  --warm-white:#ffffff;
  --sky:#dff5ff;
  --sky-deep:#8fdcff;
  --blue:#357c9c;
  --blue-dark:#1f526b;
  --orange:#ffb36b;
  --orange-deep:#ff8f3f;
  --text:#2f3f46;
  --muted:#7a8b91;
  --border:#f0dfc9;
  --danger:#ff6b6b;
  --shadow:rgba(135,98,48,0.14);
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Microsoft JhengHei",sans-serif;
  background:
    radial-gradient(circle at top left, rgba(255,179,107,0.22), transparent 28%),
    radial-gradient(circle at top right, rgba(143,220,255,0.28), transparent 30%),
    linear-gradient(180deg,var(--cream),#f7fbff);
  color:var(--text);
}

/* ===== Top Bar ===== */
.topbar{
  background:rgba(255,255,255,0.84);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  color:var(--text);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:14px 20px;
  font-weight:800;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid rgba(240,223,201,0.85);
  box-shadow:0 6px 20px var(--shadow);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.logo{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:12px;
  background:#ffffff;
  box-shadow:0 4px 12px rgba(31,82,107,0.12);
  flex-shrink:0;
}

.brand-text{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.title{
  font-size:22px;
  line-height:1.15;
  color:var(--blue-dark);
  white-space:nowrap;
}

.subtitle{
  font-size:13px;
  font-weight:600;
  color:var(--muted);
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.top-info{
  text-align:right;
  flex-shrink:0;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.date-update{
  font-size:14px;
  color:var(--blue-dark);
  font-weight:900;
  white-space:nowrap;
}

.date-update span{
  color:var(--orange-deep);
}

.weather-line{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
  white-space:nowrap;
}

/* ===== Control Bar ===== */
.controlbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:16px 16px 0;
  padding:14px 16px;
  background:rgba(255,255,255,0.78);
  border:1px solid rgba(240,223,201,0.78);
  border-radius:18px;
  box-shadow:0 8px 18px rgba(135,98,48,0.08);
}

.info{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}

.info strong{
  color:var(--blue-dark);
}

.update-btn{
  border:0;
  background:linear-gradient(135deg,var(--orange),var(--orange-deep));
  color:#ffffff;
  font-weight:900;
  padding:11px 18px;
  border-radius:999px;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
  white-space:nowrap;
  box-shadow:0 6px 14px rgba(255,143,63,0.28);
}

.update-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(255,143,63,0.34);
}

.update-btn:disabled{
  opacity:0.65;
  cursor:not-allowed;
  transform:none;
}

/* ===== Main ===== */
.panel{
  padding:16px;
}

.route-group{
  margin-bottom:20px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:17px;
  font-weight:950;
  color:var(--blue-dark);
  margin:4px 2px 12px;
}

.section-title::before{
  content:"";
  width:9px;
  height:24px;
  background:linear-gradient(180deg,var(--orange),var(--sky-deep));
  border-radius:999px;
}

.bus-list{
  display:flex;
  flex-direction:column;
  gap:13px;
}

/* ===== Card ===== */
.bus-card{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(145deg,rgba(255,255,255,0.96),rgba(255,248,236,0.96));
  border:1px solid rgba(240,223,201,0.9);
  border-radius:22px;
  padding:16px;
  display:grid;
  grid-template-columns:92px 1fr auto;
  gap:14px;
  align-items:center;
  box-shadow:0 10px 24px rgba(135,98,48,0.11);
}

.bus-card::after{
  content:"";
  position:absolute;
  right:-40px;
  top:-40px;
  width:120px;
  height:120px;
  background:rgba(143,220,255,0.26);
  border-radius:50%;
  pointer-events:none;
}

.route-box{
  position:relative;
  z-index:1;
  background:linear-gradient(135deg,var(--sky),var(--sky-deep));
  color:var(--blue-dark);
  font-size:34px;
  font-weight:950;
  height:74px;
  border-radius:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.65);
}

.route-box.urgent-box{
  background:linear-gradient(135deg,#ff8a8a,var(--danger));
  color:#fff;
  animation:pulse 1s infinite;
}

.bus-main{
  position:relative;
  z-index:1;
  min-width:0;
}

.destination{
  font-size:20px;
  font-weight:900;
  margin-bottom:6px;
  color:var(--text);
}

.destination .home-word{
  color:var(--orange-deep);
}

.station{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.station::before{
  content:"上車站：";
  color:#96a4a9;
}

.eta-box{
  position:relative;
  z-index:1;
  text-align:right;
  min-width:105px;
}

.eta-label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-bottom:3px;
}

.next-time{
  font-size:30px;
  font-weight:950;
  color:var(--blue);
  line-height:1.1;
}

.next-time.urgent{
  color:var(--danger);
  animation:blink 1s infinite;
}

.second-time{
  margin-top:5px;
  color:var(--muted);
  font-size:14px;
}

.status{
  margin-top:7px;
  display:inline-block;
  font-size:13px;
  color:var(--blue-dark);
  background:rgba(223,245,255,0.85);
  padding:4px 9px;
  border-radius:999px;
  font-weight:800;
}

.status.urgent{
  color:#ffffff;
  background:var(--danger);
}

/* ===== Bottom ===== */
.bottombar{
  color:var(--muted);
  font-size:13px;
  padding:0 18px 24px;
  display:flex;
  justify-content:flex-end;
  gap:12px;
  flex-wrap:wrap;
}

.bottombar span{
  color:var(--blue-dark);
  font-weight:800;
}

/* ===== Loading / Empty ===== */
.message{
  color:var(--muted);
  text-align:center;
  padding:34px 10px;
  background:rgba(255,255,255,0.65);
  border:1px dashed rgba(240,223,201,0.9);
  border-radius:18px;
}

/* ===== Animations ===== */
@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.45;}
  100%{opacity:1;}
}

@keyframes pulse{
  0%{box-shadow:0 0 0 rgba(255,107,107,0);}
  50%{box-shadow:0 0 20px rgba(255,107,107,0.68);}
  100%{box-shadow:0 0 0 rgba(255,107,107,0);}
}

/* ===== Mobile ===== */
@media(max-width:600px){
  .topbar{
    padding:12px 14px;
    gap:10px;
    align-items:flex-start;
  }

  .logo{
    width:38px;
    height:38px;
    border-radius:10px;
  }

  .title{
    font-size:19px;
  }

  .subtitle{
    font-size:12px;
    max-width:145px;
  }

  .top-info{
    gap:3px;
  }

  .date-update{
    font-size:12px;
  }

  .weather-line{
    font-size:12px;
  }

  .controlbar{
    margin:12px 12px 0;
    align-items:flex-start;
    flex-direction:column;
  }

  .update-btn{
    width:100%;
  }

  .panel{
    padding:12px;
  }

  .bus-card{
    grid-template-columns:74px 1fr;
    grid-template-areas:
      "route main"
      "route eta";
    padding:14px;
    border-radius:20px;
  }

  .route-box{
    grid-area:route;
    width:74px;
    height:100%;
    min-height:106px;
    font-size:28px;
  }

  .bus-main{
    grid-area:main;
  }

  .eta-box{
    grid-area:eta;
    text-align:left;
    min-width:0;
  }

  .next-time{
    font-size:27px;
  }

  .destination{
    font-size:18px;
  }
}
</style>
</head>

<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="brand">
    <img class="logo" src="icon/icon.png" alt="回家巴士 Logo">
    <div class="brand-text">
      <div class="title">回家巴士</div>
      <div class="subtitle">陪你睇住下一班歸家的車</div>
    </div>
  </div>

  <div class="top-info">
    <div class="date-update">
      <span id="dateText">2026年10月02日 週五</span>
    </div>
    <div class="weather-line" id="weatherText">
      天氣：大雨 · 23°C
    </div>
    <div class="update-time" id="updateTime">
    剛剛更新：<span id="lastUpdate">--</span>
    </div>
    </div>
</div>

<!-- Control Bar -->
<div class="controlbar">
  <div class="info">
    <div>少一點等待，多一點安心。</div>
    <div>自動幫你留意下一班回家的巴士。</div>
  </div>

  <button class="update-btn" id="updateBtn" onclick="manualUpdate()">
    重新看看巴士
  </button>
</div>

<!-- Main Panel -->
<div class="panel">

  <div class="route-group">
    <div class="section-title">返蘇屋邨</div>
    <div class="bus-list" id="busList-SO-UK">
      <div class="message">正在幫你看看返蘇屋邨嘅巴士...</div>
    </div>
  </div>

  <div class="route-group">
    <div class="section-title">返怡峰苑</div>
    <div class="bus-list" id="busList-YI-FUNG">
      <div class="message">正在幫你看看返怡峰苑嘅巴士...</div>
    </div>
  </div>

</div>

<!-- Bottom Bar -->
<div class="bottombar">
  <div>每 15 秒自動幫你更新一次</div>
</div>

<script>
const SERVICE_TYPE = "1";

/*
  重要：
  stopId 需要用九巴 API 的巴士站 ID。
  下面 stopNameText 會按你要求顯示指定上車站文字。

  如果 ETA 未能顯示，通常是 stopId 需要改成正確的站 ID。
*/

const ROUTE_GROUPS = [
  {
    id:"SO-UK",
    title:"返蘇屋邨",
    routes:[
      {
        route:"31B",
        dest:"奧運站",
        stopNameText:"葵涌業成街",
        stopId:"C3672D8D28801773"
      },
      {
        route:"36B",
        dest:"高鐵(西九龍站)",
        stopNameText:"葵涌業成街",
        stopId:"C3672D8D28801773"
      },
      {
        route:"35A",
        dest:"尖沙咀東",
        stopNameText:"石籬邨石俊樓",
        stopId:"A7516C49B99EFD78"
      },
      {
        route:"37",
        dest:"奧運站",
        stopNameText:"葵盛(中)",
        stopId:"98A42EFF69A579A0"
      }
    ]
  },
  {
    id:"YI-FUNG",
    title:"返怡峰苑",
    routes:[
      {
        route:"38",
        dest:"平田",
        stopNameText:"葵盛(東)",
        stopId:"7CB0618D76B5F553"
      }
    ]
  }
];

let etaData = {};
let isUpdating = false;

function updateTopInfo(){
  const now = new Date();

  document.getElementById("dateText").innerText =
    now.toLocaleDateString("zh-HK", {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      weekday:"short"
    }).replace(/\//g,"年").replace("年", "年").replace("年", "年");

  /*
    上面瀏覽器格式未必完全一致，所以用手動格式化更穩定。
  */

  const weekdays = ["週日","週一","週二","週三","週四","週五","週六"];
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2,"0");
  const d = String(now.getDate()).padStart(2,"0");
  const w = weekdays[now.getDay()];

  document.getElementById("dateText").innerText =
    `${y}年${m}月${d}日 ${w}`;
}

function getMinutes(t){
  if(!t) return "--";

  const diff = Math.floor((new Date(t) - new Date()) / 60000);

  if(diff < 0) return 0;

  return diff;
}

function getEtaText(value){
  if(value === "--") return "--";
  if(value === 0) return "到左啦!";
  return `${value} 分鐘`;
}

function getWarmStatus(m1){
  if(m1 === "--"){
    return "暫時未有到站時間";
  }

  if(m1 === 0){
    return "快到啦，準備出發";
  }

  if(m1 <= 3){
    return "差不多到，可以行去車站";
  }

  if(m1 <= 8){
    return "時間剛好，慢慢準備";
  }

  return "仲有少少時間，唔使急";
}

function getEtaKey(r){
  return `${r.route}_${r.dest}_${r.stopNameText}`;
}

function renderGroup(group){
  const list = document.getElementById(`busList-${group.id}`);
  list.innerHTML = "";

  if(group.routes.length === 0){
    list.innerHTML = `<div class="message">呢組暫時未有巴士路線</div>`;
    return;
  }

  group.routes.forEach(r => {
    const card = document.createElement("div");
    card.className = "bus-card";

    const key = getEtaKey(r);
    const etas = etaData[key] || [];

    const m1 = etas[0] ? getMinutes(etas[0]) : "--";
    const m2 = etas[1] ? getMinutes(etas[1]) : "--";

    let urgentClass = "";
    let boxClass = "route-box";

    if(m1 === 0){
      urgentClass = "urgent";
      boxClass += " urgent-box";
    }else if(m1 !== "--" && m1 <= 3){
      urgentClass = "urgent";
    }

    const statusText = getWarmStatus(m1);

    card.innerHTML = `
      <div class="${boxClass}">
        ${r.route}
      </div>

      <div class="bus-main">
        <div class="destination">
          往 <span class="home-word">${r.dest}</span>
        </div>
        <div class="station">${r.stopNameText}</div>
      </div>

      <div class="eta-box">
        <div class="eta-label">下一班</div>
        <div class="next-time ${urgentClass}">
          ${getEtaText(m1)}
        </div>
        <div class="second-time">
          再下一班：${getEtaText(m2)}
        </div>
        <div class="status ${urgentClass}">
          ${statusText}
        </div>
      </div>
    `;

    list.appendChild(card);
  });
}

function render(){
  ROUTE_GROUPS.forEach(group => renderGroup(group));
}

async function fetchETA(){
  if(isUpdating) return;

  isUpdating = true;

  const btn = document.getElementById("updateBtn");
  btn.disabled = true;
  btn.innerText = "幫你更新中...";

  for(const group of ROUTE_GROUPS){
    for(const r of group.routes){
      const key = getEtaKey(r);

      if(!r.stopId){
        etaData[key] = [];
        continue;
      }

      try{
        const res = await fetch(
          `https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stopId}/${r.route}/${SERVICE_TYPE}`
        );

        const data = await res.json();

        const filtered = data.data.filter(x => {
          return x.dest_tc && x.dest_tc.includes(r.dest);
        });

        etaData[key] = filtered
          .slice(0,2)
          .map(x => x.eta);

      }catch(error){
        etaData[key] = [];
      }
    }
  }

  document.getElementById("lastUpdate").innerText =
    new Date().toLocaleTimeString("zh-HK", {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    });

  render();

  btn.disabled = false;
  btn.innerText = "重新看看巴士";

  isUpdating = false;
}

function manualUpdate(){
  fetchETA();
}

/* Initial Load */
updateTopInfo();
render();
fetchETA();

/* Auto Update */
setInterval(updateTopInfo, 1000);
setInterval(fetchETA, 15000);
</script>

</body>
</html>
