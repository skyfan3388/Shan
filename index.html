<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>巴士通勤儀表板</title>

<style>
:root{
  --main:#99e6ff;
  --main-dark:#7ae9f5;
  --bg#18242d;
  --card:#f2f7fa;
  --card-light:#22313c;
  --text:#ffffff;
  --muted:#aebbc4;
  --danger:#ff6b6b;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Microsoft JhengHei",sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ===== Top Bar ===== */
.topbar{
  background:var(--main);
  color:#102027;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:18px 22px;
  font-weight:800;
  position:sticky;
  top:0;
  z-index:10;
}

.title{
  font-size:24px;
}

.clock{
  font-size:32px;
  letter-spacing:1px;
}

/* ===== Control Bar ===== */
.controlbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  background:#0c1319;
  border-bottom:1px solid rgba(153,230,255,0.2);
}

.info{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
}

.update-btn{
  border:0;
  background:var(--main);
  color:#102027;
  font-weight:800;
  padding:10px 16px;
  border-radius:999px;
  cursor:pointer;
  font-size:15px;
  transition:0.2s;
  white-space:nowrap;
}

.update-btn:hover{
  background:var(--main-dark);
}

.update-btn:disabled{
  opacity:0.6;
  cursor:not-allowed;
}

/* ===== Main ===== */
.panel{
  padding:16px;
}

.bus-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* ===== Card ===== */
.bus-card{
  background:linear-gradient(145deg,var(--card),var(--card-light));
  border:1px solid rgba(153,230,255,0.18);
  border-radius:18px;
  padding:16px;
  display:grid;
  grid-template-columns:90px 1fr auto;
  gap:14px;
  align-items:center;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.route-box{
  background:var(--main);
  color:#102027;
  font-size:34px;
  font-weight:900;
  height:72px;
  border-radius:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.route-box.urgent-box{
  background:var(--danger);
  color:#fff;
  animation:pulse 1s infinite;
}

.bus-main{
  min-width:0;
}

.destination{
  font-size:20px;
  font-weight:800;
  margin-bottom:6px;
}

.station{
  font-size:14px;
  color:var(--muted);
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.eta-box{
  text-align:right;
  min-width:95px;
}

.next-time{
  font-size:30px;
  font-weight:900;
  color:var(--main);
}

.next-time.urgent{
  color:var(--danger);
  animation:blink 1s infinite;
}

.second-time{
  margin-top:4px;
  color:var(--muted);
  font-size:14px;
}

.status{
  margin-top:6px;
  font-size:13px;
  color:var(--muted);
}

.status.urgent{
  color:var(--danger);
  font-weight:800;
}

/* ===== Bottom ===== */
.bottombar{
  color:var(--muted);
  font-size:13px;
  padding:14px 18px 22px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}

/* ===== Loading / Empty ===== */
.message{
  color:var(--muted);
  text-align:center;
  padding:30px 10px;
}

/* ===== Animations ===== */
@keyframes blink{
  0%{opacity:1;}
  50%{opacity:0.45;}
  100%{opacity:1;}
}

@keyframes pulse{
  0%{box-shadow:0 0 0 rgba(255,107,107,0);}
  50%{box-shadow:0 0 18px rgba(255,107,107,0.85);}
  100%{box-shadow:0 0 0 rgba(255,107,107,0);}
}

/* ===== Mobile ===== */
@media(max-width:600px){
  .topbar{
    padding:14px 16px;
  }

  .title{
    font-size:20px;
  }

  .clock{
    font-size:26px;
  }

  .controlbar{
    align-items:flex-start;
    flex-direction:column;
  }

  .update-btn{
    width:100%;
  }

  .bus-card{
    grid-template-columns:72px 1fr;
    grid-template-areas:
      "route main"
      "route eta";
  }

  .route-box{
    grid-area:route;
    width:72px;
    height:100%;
    min-height:96px;
    font-size:28px;
  }

  .bus-main{
    grid-area:main;
  }

  .eta-box{
    grid-area:eta;
    text-align:left;
  }

  .next-time{
    font-size:26px;
  }
}
</style>
</head>

<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="title">巴士通勤</div>
  <div class="clock" id="clock">--:--</div>
</div>

<!-- Control Bar -->
<div class="controlbar">
  <div class="info">
    <div id="date">--</div>
    <div>最後更新：<span id="lastUpdate">--</span></div>
  </div>

  <button class="update-btn" id="updateBtn" onclick="manualUpdate()">
    即時更新巴士資料
  </button>
</div>

<!-- Main Panel -->
<div class="panel">
  <div class="bus-list" id="busList">
    <div class="message">正在載入巴士資料...</div>
  </div>
</div>

<!-- Bottom Bar -->
<div class="bottombar">
  <div>每 15 秒自動更新一次</div>
</div>

<script>
const SERVICE_TYPE = "1";

/*
  在這裡加入或修改路線。

  route  = 巴士路線
  dest   = 目的地關鍵字，必須和九巴 API 目的地文字部分相同
  stopId = 巴士站 ID
*/

const ROUTES = [
  {route:"38", dest:"平田", stopId:"C3672D8D28801773"},
  {route:"42C", dest:"藍田", stopId:"C3672D8D28801773"},
  {route:"40P", dest:"觀塘", stopId:"A7516C49B99EFD78"}

  /*
  新增路線例子：

  ,{route:"89D", dest:"烏溪沙站", stopId:"XXXXXXXXXXXXXXX"}
  ,{route:"74X", dest:"大埔中心", stopId:"XXXXXXXXXXXXXXX"}
  ,{route:"277X", dest:"聯和墟", stopId:"XXXXXXXXXXXXXXX"}
  */
];

let etaData = {};
let stopNames = {};
let isUpdating = false;

function updateClock(){
  const now = new Date();

  document.getElementById("clock").innerText =
    now.toLocaleTimeString("zh-HK", {
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    });

  document.getElementById("date").innerText =
    now.toLocaleDateString("zh-HK", {
      weekday:"short",
      year:"numeric",
      month:"short",
      day:"2-digit"
    });
}

function getMinutes(t){
  if(!t) return "--";

  const diff = Math.floor((new Date(t) - new Date()) / 60000);

  if(diff < 0) return 0;

  return diff;
}

async function fetchStopName(stopId){
  if(stopNames[stopId]) return;

  try{
    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${stopId}`);
    const data = await res.json();

    stopNames[stopId] = data.data.name_tc || "--";
  }catch(error){
    stopNames[stopId] = "--";
  }
}

function cleanStationName(name){
  if(!name) return "--";
  return name.replace(/\s*\(.*?\)/g,"");
}

function getEtaText(value){
  if(value === "--") return "--";
  if(value === 0) return "即到";
  return `${value} 分鐘`;
}

function render(){
  const list = document.getElementById("busList");
  list.innerHTML = "";

  if(ROUTES.length === 0){
    list.innerHTML = `<div class="message">尚未設定路線</div>`;
    return;
  }

  ROUTES.forEach(r => {
    const card = document.createElement("div");
    card.className = "bus-card";

    const etas = etaData[r.route] || [];

    const m1 = etas[0] ? getMinutes(etas[0]) : "--";
    const m2 = etas[1] ? getMinutes(etas[1]) : "--";

    let statusText = "正常候車";
    let urgentClass = "";
    let boxClass = "route-box";

    if(m1 === 0){
      statusText = "即將到站";
      urgentClass = "urgent";
      boxClass += " urgent-box";
    }else if(m1 !== "--" && m1 <= 3){
      statusText = "快到站";
      urgentClass = "urgent";
    }

    const station = cleanStationName(stopNames[r.stopId] || "--");

    card.innerHTML = `
      <div class="${boxClass}">
        ${r.route}
      </div>

      <div class="bus-main">
        <div class="destination">往 ${r.dest}</div>
        <div class="station">${station}</div>
      </div>

      <div class="eta-box">
        <div class="next-time ${urgentClass}">
          ${getEtaText(m1)}
        </div>
        <div class="second-time">
          下班：${getEtaText(m2)}
        </div>
        <div class="status ${urgentClass}">
          ${statusText}
        </div>
      </div>
    `;

    list.appendChild(card);
  });
}

async function fetchETA(){
  if(isUpdating) return;

  isUpdating = true;

  const btn = document.getElementById("updateBtn");
  btn.disabled = true;
  btn.innerText = "更新中...";

  for(const r of ROUTES){
    await fetchStopName(r.stopId);

    try{
      const res = await fetch(
        `https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stopId}/${r.route}/${SERVICE_TYPE}`
      );

      const data = await res.json();

      const filtered = data.data.filter(x => {
        return x.dest_tc && x.dest_tc.includes(r.dest);
      });

      etaData[r.route] = filtered
        .slice(0,2)
        .map(x => x.eta);

    }catch(error){
      etaData[r.route] = [];
    }
  }

  document.getElementById("lastUpdate").innerText =
    new Date().toLocaleTimeString("zh-HK", {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    });

  render();

  btn.disabled = false;
  btn.innerText = "即時更新巴士資料";

  isUpdating = false;
}

function manualUpdate(){
  fetchETA();
}

/* Initial Load */
updateClock();
render();
fetchETA();

/* Auto Update */
setInterval(updateClock, 1000);
setInterval(fetchETA, 15000);
</script>

</body>
</html>
